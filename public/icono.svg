<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Precio Pirata</title>
  <defs>
    <clipPath id="marco"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="llama" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c8102e"/>
      <stop offset=".55" stop-color="#ff6b1a"/>
      <stop offset="1" stop-color="#ffc21a"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#marco)">
    <!-- Fondo con los colores de la bandera de Santiago del Estero: celeste, blanco y rojo punzó -->
    <rect width="512" height="512" fill="#5ba4d9"/>
    <rect y="150" width="512" height="34" fill="#ffffff"/>
    <rect y="184" width="512" height="144" fill="#c8102e"/>
    <rect y="328" width="512" height="34" fill="#ffffff"/>

    <!-- Sol de la bandera detrás del chanchito -->
    <g fill="#f6b40e">
      <circle cx="262" cy="270" r="118"/>
      <path d="M262 108 l14 46 h-28 z M262 432 l14 -46 h-28 z M100 270 l46 14 v-28 z M424 270 l-46 14 v-28 z
               M147 155 l42 22 -20 20 z M377 385 l-42 -22 20 -20 z M377 155 l-22 42 -20 -20 z M147 385 l22 -42 20 20 z"/>
    </g>

    <!-- Llamas del Hot Sale que suben desde abajo -->
    <path d="M40 512 C40 450 80 430 70 380 C110 410 120 440 112 470 C130 440 150 420 140 372 C190 410 200 460 186 512 Z" fill="url(#llama)"/>
    <path d="M330 512 C320 460 350 440 350 396 C390 426 404 462 392 494 C408 470 430 456 426 414 C470 450 480 486 470 512 Z" fill="url(#llama)"/>
  </g>

  <!-- Bandera pirata sobre el lomo -->
  <line x1="212" y1="190" x2="212" y2="58" stroke="#3b2a1a" stroke-width="10" stroke-linecap="round"/>
  <path d="M217 62 L318 62 Q300 90 318 118 L217 118 Z" fill="#111"/>
  <circle cx="262" cy="84" r="13" fill="#fff"/>
  <rect x="255" y="93" width="14" height="8" rx="2" fill="#fff"/>
  <path d="M243 104 L281 116 M281 104 L243 116" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- Chanchito alcancía con borde oscuro para que se distinga del fondo -->
  <g stroke="#7a2b3f" stroke-width="6" stroke-linejoin="round">
    <path d="M128 300 q-34 -6 -38 -34" fill="none" stroke="#e98aa3" stroke-width="10" stroke-linecap="round"/>
    <rect x="170" y="370" width="38" height="56" rx="14" fill="#e98aa3"/>
    <rect x="300" y="370" width="38" height="56" rx="14" fill="#e98aa3"/>
    <path d="M300 196 l18 -54 l40 46 z" fill="#e98aa3"/>
    <ellipse cx="262" cy="292" rx="146" ry="112" fill="#f6b3c4"/>
    <path d="M308 200 l14 -40 l30 36 z" fill="#f6b3c4"/>
    <ellipse cx="404" cy="300" rx="38" ry="34" fill="#e98aa3"/>
  </g>
  <ellipse cx="392" cy="298" rx="7" ry="10" fill="#b4546e"/>
  <ellipse cx="416" cy="298" rx="7" ry="10" fill="#b4546e"/>
  <!-- Ranura para las monedas -->
  <rect x="226" y="194" width="72" height="14" rx="7" fill="#b4546e"/>
  <!-- Parche de pirata -->
  <path d="M268 210 L398 262" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="350" cy="250" rx="26" ry="22" fill="#111"/>
  <!-- Llamita en la cola: el chanchito "prendido fuego" con las ofertas -->
  <path d="M86 262 C70 236 84 214 96 200 C100 222 112 228 110 246 C104 258 96 262 86 262 Z" fill="url(#llama)"/>

  <!-- Lupa con el signo pesos -->
  <line x1="122" y1="412" x2="64" y2="470" stroke="#3b2a1a" stroke-width="26" stroke-linecap="round"/>
  <circle cx="160" cy="372" r="74" fill="#ffffff" stroke="#f6b40e" stroke-width="18"/>
  <circle cx="160" cy="372" r="83" fill="none" stroke="#3b2a1a" stroke-width="4"/>
  <text x="160" y="372" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="700" fill="#c8102e">$</text>
</svg>
